<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Checker (Lists and Tuples)</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

<body>
    <div>
         <form>

            <button type="submit">Check Club Membership</button>
         </form>
    </div>
    
    <script type="py" src="main.py" ></script>
